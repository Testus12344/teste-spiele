<!DOCTYPE html>
<html lang="de">
<head>

    }
    h1 {
      color: #333;
    }
    iframe {
      margin: 20px auto;
      border: 2px solid #1a0dab;
      border-radius: 8px;
      display: block;
    }
  </style>
</head>
<body>
  <h1>Meine Spiele-Testseite</h1>

    allow="fullscreen; autoplay; encrypted-media; picture-in-picture"
    frameborder="0"
    width="800"
    height="450">
  </iframe>

  <!-- Spiel 2 -->
  <iframe
    src="https://www.crazygames.com/embed/20456"
