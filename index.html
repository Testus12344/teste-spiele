<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hauptseite mit Schlüssel</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: #f0f0f0;
        padding: 50px;
    }
    input, button {
        font-size: 18px;
        padding: 10px;
        margin: 10px;
    }
    /* Overlay-Fenster */
    #popup {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 850px;
        height: 600px;
        background-color: white;
        border: 3px solid #1a0dab;
        border-radius: 10px;
        z-index: 1000;
        overflow: auto;
        padding: 20px;
        box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }
    #popup iframe {
        width: 800px;
        height: 450px;
        margin: 10px auto;
        display: block;
        border: 2px solid #1a0dab;
        border-radius: 8px;
    }
    #overlay-bg {
        display: none;
        position: fixed;
        top:0; left:0;
        width: 100%; height: 100%;
        background-color: rgba(0,0,0,0.5);
        z-index: 500;
    }
    #close-btn {
        margin-top: 10px;
        padding: 5px 15px;
        font-size: 16px;
    }
</style>
</head>
<body>

<h1>Willkommen! Bitte Lizenzschlüssel eingeben</h1>
<input type="text" id="lizenzKey" placeholder="Lizenzschlüssel">
<button onclick="openPopup()">Zugang</button>

<!-- Hintergrund Overlay -->
<div id="overlay-bg"></div>

<!-- Popup-Fenster -->
<div id="popup">
    <h2>Hier sind deine Spiele!</h2>
    <iframe src="https://playgama.com/export/game/rooftop-run?clid=p_871e0faf-84d0-4f04-9763-588bd2ced4a4" allow="fullscreen; autoplay;"></iframe>
    <iframe src="https://playgama.com/export/game/tb-world?clid=p_871e0faf-84d0-4f04-9763-588bd2ced4a4" allow="fullscreen; autoplay;"></iframe>
    <iframe src="https://playgama.com/export/game/cooking-empire?clid=p_871e0faf-84d0-4f04-9763-588bd2ced4a4" allow="fullscreen; autoplay;"></iframe>
    <iframe src="https://playgama.com/export/game/meme-beatdown?clid=p_871e0faf-84d0-4f04-9763-588bd2ced4a4" allow="fullscreen; autoplay;"></iframe>
    <button id="close-btn" onclick="closePopup()">Schließen</button>
</div>

<script>
function openPopup() {
    const key = document.getElementById('lizenzKey').value;
    if(key === '1234') {
        document.getElementById('popup').style.display = 'block';
        document.getElementById('overlay-bg').style.display = 'block';
    } else {
        alert('Ungültiger Schlüssel!');
    }
}

function closePopup() {
    document.getElementById('popup').style.display = 'none';
    document.getElementById('overlay-bg').style.display = 'none';
}
</script>

</body>
</html>
