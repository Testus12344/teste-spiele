<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiele eingebettet – Testseite</title>
    <style>
        body {
            font-family: Arial, sans‑serif;
            text-align: center;
            padding: 30px;
            background-color: #f0f0f0;
        }
        h1 {
            color: #333;
        }
        iframe {
            margin: 20px auto;
            border: 2px solid #1a0dab;
            border-radius: 8px;
            display: block;
        }
    </style>
</head>
<body>
    <h1>Meine eingebetteten Spiele</h1>
    <p>Teste hier drei Spiele direkt auf meiner Webseite:</p>

    <!-- Spiel 1 – von HTML5Games (embed‑fähig) -->
    <iframe 
        src="https://www.htmlgames.com/embed/flower-match-3" 
        width="800" height="450" 
        allow="fullscreen; autoplay; encrypted-media; picture-in-picture">
    </iframe>

    <!-- Spiel 2 – von PlayToMax (Embed erlaubt laut Website) -->
    <iframe 
        src="https://portal.playtomax.com/embed/game/12345" 
        width="800" height="450" 
        allow="fullscreen; autoplay; encrypted-media; picture-in-picture">
    </iframe>

    <!-- Spiel 3 – von DKM Games (Embed‑fähig) -->
    <iframe 
        src="https://dkmgames.com/embedgames.php?game=shisen" 
        width="800" height="450" 
        allow="fullscreen; autoplay; encrypted-media; picture-in-picture">
    </iframe>

</body>
</html>
